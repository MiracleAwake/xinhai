[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "xinhai-memory"
version = "0.1.0"
description = "心海长期记忆库核心"
requires-python = ">=3.12"
[tool.pytest.ini_options]
pythonpath = ["src"]
[project.optional-dependencies]
mcp = ["mcp>=1.0,<2", "sqlite-vec>=0.1.9"]
codex-capture = ["websockets>=15"]
